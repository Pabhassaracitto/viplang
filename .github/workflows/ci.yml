name: CI

# Chạy analyze + test trên mọi push/PR — cổng chất lượng trước khi merge/tag
on:
  push:
    branches: [master, main, 'arena/**']
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    name: flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data

      - name: Get dependencies
        run: flutter pub get

      # Format có thể lệch theo từng bản Flutter — chỉ cảnh báo, không chặn
      - name: Check formatting (info only)
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_out.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Emit GitHub annotations cho từng lỗi (xem được qua API, không cần tải log)
          # Dạng: path:line:col: severity - message  |  info • message • path:line:col
          while IFS= read -r line; do
            if [[ "$line" =~ ^(error|warning)[[:space:]]+•[[:space:]]+(.*)[[:space:]]+•[[:space:]]+([^:]+):([0-9]+):([0-9]+) ]]; then
              sev="${BASH_REMATCH[1]}"
              msg="${BASH_REMATCH[2]}"
              path="${BASH_REMATCH[3]}"
              lno="${BASH_REMATCH[4]}"
              col="${BASH_REMATCH[5]}"
              gh_level="warning"
              [[ "$sev" == "error" ]] && gh_level="error"
              echo "::${gh_level} file=${path},line=${lno},col=${col}::${msg}"
            elif [[ "$line" =~ ^[0-9]+[[:space:]]+issues?[[:space:]]+found ]] || [[ "$line" == *"No issues found"* ]]; then
              echo "::notice::${line}"
            fi
          done < analyze_out.txt
          {
            echo '## flutter analyze'
            echo '```'
            grep -E 'error •|warning •|issues found|No issues' analyze_out.txt | tail -n 100 || tail -n 50 analyze_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-report
          path: analyze_out.txt
          if-no-files-found: ignore

      - name: Run tests
        run: flutter test --reporter expanded
