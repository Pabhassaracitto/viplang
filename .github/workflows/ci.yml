name: CI

# Chạy analyze + test trên mọi push/PR — cổng chất lượng trước khi merge/tag
on:
  push:
    branches: [master, main, 'arena/**']
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    name: flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data

      - name: Get dependencies
        run: flutter pub get

      # Format có thể lệch theo từng bản Flutter — chỉ cảnh báo, không chặn
      - name: Check formatting (info only)
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_out.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Ghi tóm tắt vào job summary (xem được cả khi log bị truncate)
          {
            echo '## flutter analyze'
            echo '```'
            # Chỉ giữ dòng error/warning + dòng tổng
            grep -E 'error •|warning •|issues found|No issues' analyze_out.txt | tail -n 100 || tail -n 50 analyze_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-report
          path: analyze_out.txt
          if-no-files-found: ignore

      - name: Run tests
        run: flutter test --reporter expanded
