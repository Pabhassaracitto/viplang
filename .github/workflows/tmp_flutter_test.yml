name: TMP flutter test (xác minh, sẽ gỡ)
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: mkdir -p assets/animations assets/audio assets/data
      - run: flutter pub get
      - name: flutter test
        run: flutter test 2>&1 | tee test_out.txt
      - name: summary
        if: always()
        run: tail -n 40 test_out.txt
