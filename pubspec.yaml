name: viplang
description: VipLang - Học tiếng Anh theo phương pháp Do Thái
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio
  just_audio: ^0.9.36
  flutter_tts: ^4.0.2

  # UI
  flutter_animate: ^4.3.0

  # Navigation — Giai đoạn 3 sẽ migrate sang go_router (đang giữ sẵn)
  go_router: ^12.1.3

  # Charts — Giai đoạn 3: biểu đồ tiến độ (fl_chart)
  fl_chart: ^0.65.0

  # Utils
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_viplang.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo_viplang.png"
  android_12:
    image: "assets/images/logo_viplang.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_viplang.png
    - assets/animations/
    - assets/audio/
    - assets/data/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
