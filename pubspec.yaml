name: viplang
description: VipLang - Học tiếng Anh theo phương pháp Do Thái
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.6.0

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  flutter_tts: ^4.0.2
  audioplayers: ^5.0.0

  # UI
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Navigation
  go_router: ^12.1.3

  # Utils
  uuid: ^4.2.2
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_viplang.png" # Đường dẫn đến ảnh của con
  min_sdk_android: 21
  
flutter_native_splash:
  color: "#ffffff" # Màu nền của màn hình chờ (ví dụ màu trắng)
  image: "assets/images/logo_viplang.png" # Icon cá nhân của con sẽ hiện ở giữa
  android_12:
    image: "assets/images/logo_viplang.png"
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_viplang.png
    - assets/animations/
    - assets/audio/
    - assets/data/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500